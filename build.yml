name: Build ManhwaZ

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ManhwaZ source
        uses: actions/checkout@v4

      - name: Checkout Keiyoushi framework
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: keiyoushi

      - name: Copy ManhwaZ module
        run: |
          rm -rf keiyoushi/src/en/manhwaz
          mkdir -p keiyoushi/src/en
          cp -R src/en/manhwaz keiyoushi/src/en/manhwaz

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Format source
        working-directory: keiyoushi
        run: ./gradlew :src:en:manhwaz:spotlessApply

      - name: Build ManhwaZ
        working-directory: keiyoushi
        run: ./gradlew :src:en:manhwaz:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaZ
          path: keiyoushi/src/en/manhwaz/build/outputs/apk/release/*.apk
