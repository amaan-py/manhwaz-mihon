name: Build ManhwaZ

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Keiyoushi framework
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: keiyoushi

      - name: Install extension module
        run: |
          rm -rf keiyoushi/src/en/manhwaz
          mkdir -p keiyoushi/src/en
          cp -R src/en/manhwaz keiyoushi/src/en/manhwaz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Format source
  working-directory: keiyoushi
  run: ./gradlew spotlessApply

- name: Build ManhwaZ
  working-directory: keiyoushi
  run: ./gradlew :src:en:manhwaz:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manhwaz-apk
          path: keiyoushi/src/en/manhwaz/build/outputs/apk/release/*.apk
